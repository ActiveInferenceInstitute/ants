name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # One gate entry point, one command per arm: every step below runs
  # `scripts/gate.py`, which is also what `uv run python scripts/gate.py fast|all`
  # runs locally. See docs/RUN_GUIDE.md for the arm table and measured timings.
  test:
    name: lint and tests
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.13"

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Gate (lint, docs, full tests)
        run: uv run python scripts/gate.py lint docs test

  gnn-conformance:
    name: gnn conformance (pinned)
    timeout-minutes: 60
    # Validates gnn/ant_colony_foraging.gnn.md with the upstream parser revision
    # pinned in gnn/upstream.json. scripts/gate.py (the `gnn` arm) fetches the
    # pinned commit and tag, provisions its interpreter, and then runs the strict
    # validator plus tests/test_gnn_conformance.py; the gate never skips.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.13"

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Gate (GNN conformance)
        run: uv run python scripts/gate.py gnn
