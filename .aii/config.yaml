    Code for the computational model in Friedman et al. (2021), "Active
    Inferants: An Active Inference Framework for Ant Colony Behavior"
    (Front. Behav. Neurosci. 15:647732). Active-inference MDP simulation
    of stigmergic ant colony foraging in a 40x40 T-maze.
