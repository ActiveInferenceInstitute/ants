[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ants"
version = "1.0.0"
description = "Active inference simulation of ant colony foraging (companion code to Friedman et al., 2021)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Alec Tschantz" }]
keywords = ["active-inference", "ants", "foraging", "simulation", "stigmergy"]
dependencies = [
    "numpy>=1.21",
    "matplotlib>=3.5",
    "imageio>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
]

[tool.setuptools]
py-modules = ["ants", "config"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=ants --cov=config --cov-report=term-missing --cov-fail-under=90"

[tool.ruff]
target-version = "py310"
line-length = 100
